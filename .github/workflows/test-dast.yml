name: Tests (dast)

on:
  pull_request:

env:
  NODE_VERSION: 26.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Tests (fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          # Docker Hub hosts are for the local dynamodb/postgres test containers
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          npm ci
      - name: Build
        run: |
          npm run build --if-present
      - name: Fuzzing tests
        run: |
          npm run test:dynamodb &
          npm run test:postgres &
          # `docker run` pulls before it listens; wait for both ports rather than racing them.
          for port in 8000 5432; do
            for _ in $(seq 1 60); do
              (exec 3<>/dev/tcp/127.0.0.1/"$port") 2>/dev/null && break
              sleep 2
            done
          done
          npm run test:dast:fuzz

# zaproxy Endpoint Fuzzing
