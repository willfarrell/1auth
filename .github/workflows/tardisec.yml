name: tardisec
on:
  schedule:
    - cron: "11 2 * * 4"
  workflow_dispatch: {}

env:
  NODE_VERSION: 26.x

permissions: {}
concurrency:
  group: tardisec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # mint the OIDC token tardisec verifies
      contents: write # push the sync branch
      pull-requests: write # open the PR
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            api.tardisec.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts # biome, from the integrity-checked lockfile
      - uses: tardisec/tardisec-integration-github-action@79a37c4a612483144768e0eb020b2b7236268862 # main
        with:
          base: develop
          domain: 1auth.js.org
          path: /websites/1auth.js.org
          files: |
            .tardisec.json
            .tardisec.sveltekit.json
          format: npm run lint
